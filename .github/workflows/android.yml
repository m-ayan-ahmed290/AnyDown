name: Build and release AnyDown
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Prepare installable APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/AnyDown-${GITHUB_REF_NAME//\//-}.apk
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AnyDown-apk
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "AnyDown $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
